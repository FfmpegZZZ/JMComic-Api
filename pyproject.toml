[project]
name = "jmcomic-api"
version = "2.1.0"
description = "FastAPI service wrapping the jmcomic library to download albums and serve them as PDFs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "cryptography>=46.0.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "jmcomic==2.7.11",
    "pypdf>=6.21.4",
    "Pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "PyYAML>=6.0.3",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx2>=2.16.0",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "types-PyYAML>=6.0.12.20261103",
]

[project.scripts]
jmcomic-api = "jmcomic_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jmcomic_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that hit real network or filesystem (slow)",
]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idiomatic dependency-injection pattern uses these as call defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
files = ["src"]
